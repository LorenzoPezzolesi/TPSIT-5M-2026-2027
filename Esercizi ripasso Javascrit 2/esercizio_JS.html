<html>

<head></head>

<body>
    <script type="text/javascript">

        //prova write
        document.writeln('ciao mondo <br>');
        // prova con somma di stringhe
        var str1 = 'Ciao';
        var str2 = 'Mondo';
        document.write(str1 + str2 + '<br>');
        // prova con variabile numerica
        var num = 7;
        num++;
        document.write(num + "<br>");
        // ciclo for
        var i = 0;
        for (i = 0; i < 3; i++) {
            document.write('Ciao Mondo');
        }
        document.write('<br>');
        //ciclo while andando a capo
        var i = 0;
        while (i < 10) {
            document.write('Conto: ' + i + "<br>");
            i++;
        }
    </script>

    <!-- Metodo di lettura e scrittura dati con finestre pop up  
e conversione stringa/integer-->
    <script type='text/javascript'>
        var num = "";

        num = num + 1;
        alert(num);
    </script>


    <!--Metodo con le Form di lettura dati da utente -->
    <form name='dati'>
        <input type='text' name='testo' />
        <input type='button' onClick='mostra()' value='clicca' />
    </form>
    <script type='text/javascript'>
        function mostra() {
            //alert('modo 1:'+document.dati.testo.value);
